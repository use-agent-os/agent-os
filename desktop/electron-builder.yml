appId: dev.agentos.desktop
productName: AgentOS
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# The engine installer the app drives on first launch (main/bootstrap). The
# repo's install.sh is the single source of truth; it lands at
# Contents/Resources/install.sh.
extraResources:
  - from: ../install.sh
    to: install.sh
asar: true
mac:
  category: public.app-category.developer-tools
  # 1024x1024 PNG rendered by scripts/make-icon.py; electron-builder derives the .icns.
  icon: resources/icon.png
  target:
    # electron-updater on macOS updates from the zip; the dmg is what people
    # download by hand. Both are published so either path works.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing: electron-builder finds the "Developer ID Application" identity in
  # the keychain (or CSC_LINK / CSC_KEY_PASSWORD in CI). With no identity it
  # warns and skips, and scripts/adhoc-sign.mjs below ad-hoc signs the bundle
  # so a local build is still an app macOS will deliver notifications for.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarize when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (or
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) are set; otherwise
  # electron-builder logs that it skipped. Gatekeeper accepts only a
  # notarized build, and so does electron-updater's staged install.
  notarize: true
  darkModeSupport: true
afterSign: scripts/adhoc-sign.mjs
dmg:
  sign: false
# Where electron-updater looks: the GitHub release for the same `v<CalVer>`
# tag that carries the Python wheel. `latest-mac.yml` + the zips are uploaded
# there by .github/workflows/desktop-release.yml.
publish:
  provider: github
  owner: use-agent-os
  repo: agent-os
  releaseType: release
npmRebuild: false
